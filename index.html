<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>formulários</title>
        <link rel="stylesheet" href="css/style.css"  />
      </head>
      <body>

            <header>
                <h1>Academia de Heróis</h1> 
                <p class="smallletters">Inscreva-se para participar da próxima missão.</p>
            </header>

            <main>
                <section id="formulario">
                    <h2>Faça sua inscrição</h2>
                    <form action="#" method="get">
                      <label for="heroi">Nome de herói:</label>
                      <input id="heroi" name="heroi" type="text"/>
             
                      <label for="email">E-mail:</label>
                      <input id="email" name="email" type="email"/>
             
                      <label for="idade">Idade:</label>
                      <input id="idade" name="idade" type="number"/>
             
                      <label for="equipe">Escolha sua equipe:</label>
                      <select id="equipe" name="equipe">
                          <option>Liga da Justiça</option>
                          <option>Jovens Titãs</option>
                          <option>Vingadores</option>
                          <option>X-Men</option>
                      </select>
             
                      <p class="titulo">Qual poder você prefere?</p>                        
                        <article class="opcao">
                            <input id="voar" name="poder" type="radio" class="opcaobotao"/>
                            <label for="voar">Voar</label>
                        </article>

                        <article class="opcao">
                            <input id="supervelocidade" name="poder" type="radio" class="opcaobotao"/>
                            <label for="supervelocidade">Supervelocidade</label>
                        </article>

                        <article class="opcao">
                            <input id="superforca" name="poder" type="radio" class="opcaobotao"/>
                            <label for="superforca">Superforça</label>
                        </article>

                        <article class="opcao">
                            <input id="missoes" name="missoes" type="checkbox" class="opcaobotao"/>
                            <label for="missoes">Quero receber novas missões.</label>
                        </article>

                         <label for="motivo">Por que você quer ser um herói?!</label>
                         <textarea id="motivo" name="motivo" rows="4"></textarea>
                         
                         <button type="submit">Enviar Inscrição</button>
                    </form>
                </section>
            </main>
      </body>
      <footer>
        <p class="smallletters">Prática de formulários HTML.</p>
      </footer>
</html>
